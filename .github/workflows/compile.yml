name: Compile SourceMod Plugins

on:
  push:
    paths:
      - 'addons/sourcemod/scripting/**.sp'
      - 'addons/sourcemod/scripting/**.inc'
  workflow_dispatch: # Manuel tetikleme butonu

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SourceMod (Linux)
        run: |
          wget -q "https://sm.alliedmods.net/smdrop/1.12/sourcemod-1.12.0.7246-git7246-linux.tar.gz" -O sm.tar.gz
          mkdir -p sm_linux
          tar -xzf sm.tar.gz -C sm_linux
          chmod +x sm_linux/addons/sourcemod/scripting/spcomp

      - name: Compile custom plugins
        run: |
          SPCOMP="sm_linux/addons/sourcemod/scripting/spcomp"
          SCRIPTING="addons/sourcemod/scripting"
          PLUGINS="addons/sourcemod/plugins"
          INCLUDE="$SCRIPTING/include"

          # Derlenecek özel pluginler
          PLUGINS_LIST=(
            "csgo_admin_selection"
            "csgo_admin_test"
            "csgo_agentschooser"
            "csgo_graffiti"
            "csgo_pin_mvp"
            "csgo_voiceagents_enabler"
            "gloves"
            "server_help"
            "weapons"
          )

          mkdir -p "$PLUGINS"
          FAIL=0

          for plugin in "${PLUGINS_LIST[@]}"; do
            SP="$SCRIPTING/${plugin}.sp"
            SMX="$PLUGINS/${plugin}.smx"

            if [ ! -f "$SP" ]; then
              echo "⚠️  $plugin.sp bulunamadı, atlanıyor"
              continue
            fi

            echo "🔨 Derleniyor: $plugin.sp"
            if $SPCOMP "$SP" -o "$SMX" -i "$INCLUDE" -i "$SCRIPTING"; then
              echo "✅ $plugin.smx başarıyla derlendi"
            else
              echo "❌ $plugin.sp derlenemedi!"
              FAIL=1
            fi
          done

          exit $FAIL

      - name: Commit compiled plugins
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add addons/sourcemod/plugins/*.smx
          if git diff --staged --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "🤖 Auto-compile: $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git push
          fi

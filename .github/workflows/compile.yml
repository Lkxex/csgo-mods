name: Compile SourceMod Plugins

on:
  push:
    paths:
      - 'addons/sourcemod/scripting/**/*.sp'
      - 'addons/sourcemod/scripting/**/*.inc'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SourceMod compiler
        shell: bash
        run: |
          set -e

          echo "Downloading SourceMod 1.12 compiler..."

          BASE_URL="https://sm.alliedmods.net/smdrop/1.12"

          SM_URL=$(curl -fsSL "$BASE_URL/" \
            | grep -oE 'sourcemod-[0-9.]+-git[0-9]+-linux\.tar\.gz' \
            | sort -V \
            | tail -n 1)

          if [ -z "$SM_URL" ]; then
            echo "ERROR: Could not find SourceMod package."
            exit 1
          fi

          echo "Package: $SM_URL"

          curl -fL "$BASE_URL/$SM_URL" -o sm.tar.gz

          mkdir -p sm_linux
          tar -xzf sm.tar.gz -C sm_linux

          SPCOMP="sm_linux/addons/sourcemod/scripting/spcomp"

          if [ ! -f "$SPCOMP" ]; then
            echo "ERROR: spcomp not found."
            exit 1
          fi

          chmod +x "$SPCOMP"

          echo "SourceMod compiler:"
          "$SPCOMP" --version || true

      - name: Compile SourcePawn plugins
        shell: bash
        run: |
          set -u

          SPCOMP="sm_linux/addons/sourcemod/scripting/spcomp"
          SCRIPTING="addons/sourcemod/scripting"
          PLUGINS="addons/sourcemod/plugins"
          INCLUDE="$SCRIPTING/include"

          mkdir -p "$PLUGINS"

          FAIL=0
          COUNT=0

          echo "=========================================="
          echo "SourcePawn compilation started"
          echo "=========================================="

          while IFS= read -r -d '' SP; do

            NAME="$(basename "$SP" .sp)"
            SMX="$PLUGINS/${NAME}.smx"

            echo ""
            echo "------------------------------------------"
            echo "Compiling: $SP"
            echo "Output:    $SMX"
            echo "------------------------------------------"

            if "$SPCOMP" \
              "$SP" \
              -o "$SMX" \
              -i "$INCLUDE" \
              -i "$SCRIPTING"
            then
              echo "SUCCESS: $NAME.smx"
              COUNT=$((COUNT + 1))
            else
              echo "FAILED: $NAME.sp"
              FAIL=1
            fi

          done < <(
            find "$SCRIPTING" \
              -maxdepth 1 \
              -type f \
              -name '*.sp' \
              -print0
          )

          echo ""
          echo "=========================================="
          echo "Compilation summary"
          echo "=========================================="
          echo "Successfully compiled: $COUNT"

          if [ "$FAIL" -ne 0 ]; then
            echo "One or more plugins failed to compile."
            exit 1
          fi

          echo "All plugins compiled successfully."

      - name: Verify generated SMX files
        shell: bash
        run: |
          set -e

          SCRIPTING="addons/sourcemod/scripting"
          PLUGINS="addons/sourcemod/plugins"

          echo "Verifying generated plugins..."

          while IFS= read -r -d '' SP; do
            NAME="$(basename "$SP" .sp)"
            SMX="$PLUGINS/${NAME}.smx"

            if [ ! -f "$SMX" ]; then
              echo "ERROR: Missing generated SMX: $SMX"
              exit 1
            fi

            if [ ! -s "$SMX" ]; then
              echo "ERROR: Empty SMX: $SMX"
              exit 1
            fi

            echo "OK: $SMX"
          done < <(
            find "$SCRIPTING" \
              -maxdepth 1 \
              -type f \
              -name '*.sp' \
              -print0
          )

      - name: Commit compiled plugins
        shell: bash
        run: |
          set -e

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add addons/sourcemod/plugins/*.smx

          if git diff --cached --quiet; then
            echo "No SMX changes detected."
            exit 0
          fi

          git commit \
            -m "🤖 Auto-compile SourceMod plugins [skip ci]"

          git push
